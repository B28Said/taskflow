
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false


  application:
    name: taskflow
  profiles:
    active: dev

server:
  port: 8081

taskflow:
  limits:
    max-active-tasks-per-assignee: 10
